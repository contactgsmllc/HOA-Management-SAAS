name: Build and Push Docker Images

on:
  push:
    branches: 
      - ci/argocd-auto-deploy

# Run one deploy at a time, so two pushes never update the ArgoCD repo at once
concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set image tag
        run: echo "IMAGE_TAG=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build backend JAR
        run: |
          cd backend
          mvn clean package -DskipTests

      - name: Build and push backend image
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 \
            -t dearsrini/society-backend:dev \
            -t dearsrini/society-backend:${IMAGE_TAG} \
            --push -f backend/Dockerfile backend

      - name: Build and push frontend image
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 \
            -t dearsrini/society-frontend:dev \
            -t dearsrini/society-frontend:${IMAGE_TAG} \
            --push -f frontend/Dockerfile frontend

      

      # Write the new image version into the ArgoCD repo -> Argo CD deploys it to the dev cluster
      - name: Checkout ArgoCD repo
        uses: actions/checkout@v4
        with:
          repository: contactgsmllc/ArgoCD
          ssh-key: ${{ secrets.ARGOCD_DEPLOY_KEY }}
          path: argocd

      - name: Update image tags for dev
        run: |
          cd argocd
          yq -i '(.images[] | select(.name == "dearsrini/society-backend")).newTag = "${{ env.IMAGE_TAG }}"' \
            dev/manifests/backend/kustomization.yaml
          yq -i '(.images[] | select(.name == "dearsrini/society-frontend")).newTag = "${{ env.IMAGE_TAG }}"' \
            dev/manifests/frontend/kustomization.yaml
          git diff

      - name: Commit and push to ArgoCD repo
        run: |
          cd argocd
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy dev: backend+frontend ${{ env.IMAGE_TAG }} (from ${{ github.sha }})" || echo "No change"
          git push
