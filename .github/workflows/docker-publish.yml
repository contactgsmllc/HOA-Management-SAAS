name: Build and Push Docker Images

on:
  push:
    branches: 
      - test

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set image tag
        run: echo "IMAGE_TAG=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # - name: Build backend JAR
      #   run: |
      #     cd backend
      #     mvn clean package -DskipTests

      # - name: Build and push backend image
      #   run: |
      #     docker buildx build --platform linux/amd64,linux/arm64 \
      #       -t dearsrini/society-backend:test \
      #       -t dearsrini/society-backend:${IMAGE_TAG} \
      #       --push -f backend/Dockerfile backend

      - name: Build and push frontend image
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 \
            -t dearsrini/society-frontend:test \
            -t dearsrini/society-frontend:${IMAGE_TAG} \
            --push -f frontend/Dockerfile frontend

      
